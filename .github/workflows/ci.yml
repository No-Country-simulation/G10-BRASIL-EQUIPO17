name: CI MediFlow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    name: Contratos e API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ai]'
      - name: Conferir sintaxe
        run: python -m compileall -q src scripts tests
      - name: Executar testes
        run: python -m pytest -q
      - name: Verificar seguranca de credenciais de exemplo
        run: |
          python -c "from pathlib import Path; assert (Path('.env.example')).exists(); assert not Path('.env').exists()"
